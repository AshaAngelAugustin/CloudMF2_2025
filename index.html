            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff9800;
            margin-top: 10px;
        }
        
        .setup-instructions strong {
            color: #e65100;
            font-size: 14px;
        }
        
        .setup-instructions ol {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .setup-instructions li {
            margin-bottom: 5px;
            font-size: 13px;
            color: #333;
        }
        
        .setup-instructions code {
            background: #ffecb3;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #e65100;
        }
        
        .filename-config input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            box-sizing: border-box;
        }
        
        .download-options small {
            display: block;
            color: #666;
            font-size: 12px;
            margin-top: 5px;
            font-style: italic;
        }
        
        .icon {
            margin-right: 8px;
        }
        
        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .form-section {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .comparison-container {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .content {
                padding: 30px 20px;
            }
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="title-section">
                    <h1>⚡ Database Converter</h1>
                    <p>Convert SQL scripts between Oracle, SQL Server, and Sybase instantly</p>
                </div>
                <div class="theme-toggle">
                    <button id="refreshBtn" class="theme-btn" onclick="refreshPage()" title="Refresh Page">
                        <span>🔄</span>
                    </button>
                    <button id="themeToggle" class="theme-btn" onclick="toggleTheme()">
                        <span id="themeIcon">🌙</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="content">
            <div class="form-section">
                <div class="form-group">
                    <label for="fileInput"><span class="icon">📁</span>Select Files:</label>
                    <input type="file" id="fileInput" accept=".txt,.sql,.csv" multiple>
                    <div class="file-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="folderMode" onchange="toggleFolderMode()">
                            <span class="checkmark"></span>
                            Select entire folder
                        </label>
                    </div>
                    <div id="selectedFiles" class="selected-files"></div>
                </div>
                
                <div class="form-group">
                    <label for="databaseSelect"><span class="icon">🎯</span>Convert to:</label>
                    <select id="databaseSelect">
                        <option value="">Select Database Type</option>
                        <option value="oracle">🔥 Oracle</option>
                        <option value="sqlserver">🏢 SQL Server</option>
                        <option value="sybase">📊 Sybase</option>
                        <option value="postgresql">🐘 PostgreSQL</option>
                        <option value="mysql">🐬 MySQL</option>
                    </select>
                </div>
            </div>
            
            <button class="convert-btn" onclick="convertFile()">
                <span class="icon">🚀</span>
                <span id="convertText">Convert File</span>
                <div id="convertSpinner" class="loading-spinner" style="display: none; width: 20px; height: 20px; margin-left: 10px;"></div>
            </button>
            
            <div id="result" class="result">
                <div class="result-header">
                    <h3><span class="icon">✅</span>Conversion Result:</h3>
                    <p id="resultText"></p>
                </div>
                
                <div class="comparison-section" style="display: block;">
                    <div class="comparison-header">
                        <h4>📊 File Comparison</h4>
                        <div class="sync-indicator" id="syncIndicator" style="display: none;">
                            <span class="icon">🔄</span>
                            <span>Synchronized Scrolling Active</span>
                        </div>
                        <div class="file-selector" id="fileSelector" style="display: none;">
                            <label for="compareFileSelect">View File:</label>
                            <select id="compareFileSelect" onchange="switchComparisonFile()">
                                <option value="0">Select a file...</option>
                            </select>
                        </div>
                    </div>
                    <div class="comparison-container">
                        <div class="comparison-panel">
                            <h5 id="originalFileLabel">📄 Original File</h5>
                            <div id="originalContent" class="content-display" data-placeholder="Original file content will appear here..."></div>
                        </div>
                        <div class="comparison-panel">
                            <h5 id="convertedFileLabel">✨ Converted File</h5>
                            <div id="convertedContent" class="content-display" data-placeholder="Converted file content will appear here..."></div>
                        </div>
                    </div>
                    
                    <!-- Download Actions Section -->
                    <div class="download-actions">
                        <button class="download-btn" onclick="downloadFile()">
                            <span class="icon">💾</span>Download Current File
                        </button>
                        <button id="downloadAllBtn" class="download-btn" onclick="downloadAllFiles()" style="display: none;">
                            <span class="icon">📦</span>Download All as ZIP
                        </button>
                    </div>
                    
                    <div class="changes-summary">
                        <h5 id="changesHeading">🔄 Changes Made:</h5>
                        <ul id="changesList">
                            <li>No changes yet - convert a file to see the differences</li>
                        </ul>
                        
                        <!-- Export Actions Section -->
                        <div class="export-actions">
                            <button class="export-btn" onclick="exportCurrentFileChanges()">
                                <span class="icon">📋</span>Export Current File Changes
                            </button>
                            <button id="exportAllBtn" class="export-btn" onclick="exportAllFilesChanges()" style="display: none;">
                                <span class="icon">📊</span>Export All Files Changes
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <script>
        let convertedContent = '';
        let originalContent = '';
        let originalFileName = '';
        let changesMade = [];
        let processedFiles = [];
        let currentFileIndex = 0;
        
        // Theme Toggle Function
        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            
            body.classList.toggle('dark-theme');
            
            if (body.classList.contains('dark-theme')) {
                themeIcon.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }
        
        // Load saved theme
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const themeIcon = document.getElementById('themeIcon');
            
            // Default to light theme if no preference is saved
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                themeIcon.textContent = '☀️';
            } else {
                // Default to light theme (savedTheme === 'light' or null)
                themeIcon.textContent = '🌙';
                if (!savedTheme) {
                    localStorage.setItem('theme', 'light');
                }
            }
        }
        
        // Refresh Page Function
        function refreshPage() {
            // Save current theme before refresh
            const currentTheme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
            localStorage.setItem('theme', currentTheme);
            
            // Refresh the page
            window.location.reload();
        }
        
        // Show/Hide Loading
        function showLoading() {
            const convertBtn = document.querySelector('.convert-btn');
            const convertText = document.getElementById('convertText');
            const convertSpinner = document.getElementById('convertSpinner');
            
            convertBtn.disabled = true;
            convertText.textContent = 'Converting...';
            convertSpinner.style.display = 'inline-block';
        }
        
        function hideLoading() {
            const convertBtn = document.querySelector('.convert-btn');
            const convertText = document.getElementById('convertText');
            const convertSpinner = document.getElementById('convertSpinner');
            
            convertBtn.disabled = false;
            convertText.textContent = 'Convert File';
            convertSpinner.style.display = 'none';
        }
        
        // File input event listener
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('fileInput');
            fileInput.addEventListener('change', handleFileSelection);
        });

        function toggleFolderMode() {
            const folderMode = document.getElementById('folderMode').checked;
            const fileInput = document.getElementById('fileInput');
            
            if (folderMode) {
                fileInput.setAttribute('webkitdirectory', '');
                fileInput.setAttribute('directory', '');
            } else {
                fileInput.removeAttribute('webkitdirectory');
                fileInput.removeAttribute('directory');
            }
            
            // Clear previous selection
            fileInput.value = '';
            document.getElementById('selectedFiles').style.display = 'none';
        }

        function handleFileSelection() {
            const fileInput = document.getElementById('fileInput');
            const selectedFilesDiv = document.getElementById('selectedFiles');
            const files = Array.from(fileInput.files);
            
            if (files.length === 0) {
                selectedFilesDiv.style.display = 'none';
                return;
            }

            // Filter for supported file types
            const supportedFiles = files.filter(file => {
                const ext = file.name.toLowerCase().split('.').pop();
                return ['txt', 'sql', 'csv'].includes(ext);
            });

            if (supportedFiles.length === 0) {
                alert('No supported files found. Please select .txt, .sql, or .csv files.');
                return;
            }

            // Display selected files
            displaySelectedFiles(supportedFiles);
        }

        function displaySelectedFiles(files) {
            const selectedFilesDiv = document.getElementById('selectedFiles');
            const totalSize = files.reduce((sum, file) => sum + file.size, 0);
            const filesPerPage = 5;
            const totalPages = Math.ceil(files.length / filesPerPage);
            
            // Store files globally for pagination
            if (!window.selectedFilesData) {
                window.selectedFilesData = {};
            }
            window.selectedFilesData.files = files;
            window.selectedFilesData.currentPage = 1;
            window.selectedFilesData.filesPerPage = filesPerPage;
            window.selectedFilesData.totalPages = totalPages;
            
            // Display summary
            let html = `<div class="files-summary">
                ${files.length} file(s) selected (${formatFileSize(totalSize)})
            </div>`;
            
            // Add container for files and pagination
            html += '<div id="paginatedFiles"></div>';
            
            selectedFilesDiv.innerHTML = html;
            selectedFilesDiv.style.display = 'block';
            
            // Display first page
            displayFilesPage(1);
        }

        function displayFilesPage(pageNumber) {
            const data = window.selectedFilesData;
            if (!data || !data.files) return;
            
            const startIndex = (pageNumber - 1) * data.filesPerPage;
            const endIndex = Math.min(startIndex + data.filesPerPage, data.files.length);
            const pageFiles = data.files.slice(startIndex, endIndex);
            
            let html = '';
            
            // Display files for current page
            pageFiles.forEach(file => {
                html += `<div class="file-item">
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">${formatFileSize(file.size)}</span>
                </div>`;
            });
            
            // Add pagination controls if more than 5 files
            if (data.totalPages > 1) {
                html += '<div class="pagination-container">';
                
                // Previous button
                html += `<button class="pagination-btn" onclick="changePage(${pageNumber - 1})" 
                         ${pageNumber === 1 ? 'disabled' : ''}>‹</button>`;
                
                // Page numbers
                for (let i = 1; i <= data.totalPages; i++) {
                    const activeClass = i === pageNumber ? 'active' : '';
                    html += `<button class="pagination-btn ${activeClass}" onclick="changePage(${i})">${i}</button>`;
                }
                
                // Next button
                html += `<button class="pagination-btn" onclick="changePage(${pageNumber + 1})" 
                         ${pageNumber === data.totalPages ? 'disabled' : ''}>›</button>`;
                
                // Page info
                html += `<span class="pagination-info">Page ${pageNumber} of ${data.totalPages}</span>`;
                
                html += '</div>';
            }
            
            document.getElementById('paginatedFiles').innerHTML = html;
            data.currentPage = pageNumber;
        }

        function changePage(pageNumber) {
            const data = window.selectedFilesData;
            if (!data || pageNumber < 1 || pageNumber > data.totalPages) return;
            
            displayFilesPage(pageNumber);
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function convertFile() {
            const fileInput = document.getElementById('fileInput');
            const databaseSelect = document.getElementById('databaseSelect');
            const result = document.getElementById('result');
            const resultText = document.getElementById('resultText');
            
            // Hide sync indicator at start
            hideSyncIndicator();
            
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Please select one or more files');
                return;
            }
            
            if (!databaseSelect.value) {
                alert('Please select a database type');
                return;
            }
            
            // Filter for supported files
            const files = Array.from(fileInput.files).filter(file => {
                const ext = file.name.toLowerCase().split('.').pop();
                return ['txt', 'sql', 'csv'].includes(ext);
            });

            if (files.length === 0) {
                alert('No supported files found. Please select .txt, .sql, or .csv files.');
                return;
            }
            
            // Initialize batch processing
            processedFiles = [];
            currentFileIndex = 0;
            
            // Show loading animation
            showLoading();
            
            // Process files
            processFilesBatch(files, databaseSelect.value);
        }

        async function processFilesBatch(files, targetDB) {
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                currentFileIndex = i;
                
                try {
                    const result = await processFile(file, targetDB);
                    processedFiles.push(result);
                } catch (error) {
                    console.error(`Error processing ${file.name}:`, error);
                    processedFiles.push({
                        fileName: file.name,
                        error: error.message,
                        success: false
                    });
                }
            }
            
            // Show results
            showBatchResults();
            hideLoading();
        }

        function processFile(file, targetDB) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    try {
                        const originalContent = e.target.result;
                        const conversionResult = performConversion(originalContent, targetDB);
                        
                        resolve({
                            fileName: file.name,
                            originalName: file.name,
                            originalContent: originalContent,
                            convertedContent: conversionResult.content,
                            changes: conversionResult.changes,
                            success: true,
                            targetDB: targetDB
                        });
                    } catch (error) {
                        reject(error);
                    }
                };
                
                reader.onerror = function() {
                    reject(new Error('Failed to read file'));
                };
                
                reader.readAsText(file);
            });
        }

        function showBatchResults() {
            const result = document.getElementById('result');
            const resultText = document.getElementById('resultText');
            const fileSelector = document.getElementById('fileSelector');
            const compareFileSelect = document.getElementById('compareFileSelect');
            
            const successCount = processedFiles.filter(f => f.success).length;
            const errorCount = processedFiles.filter(f => !f.success).length;
            
            resultText.innerHTML = `
                <strong>Conversion Complete!</strong><br>
                ✅ ${successCount} file(s) converted successfully<br>
                ${errorCount > 0 ? `❌ ${errorCount} file(s) failed<br>` : ''}
                Target format: ${processedFiles[0]?.targetDB?.toUpperCase() || 'Unknown'}
            `;
            
            // Populate file selector if multiple files
            if (processedFiles.length > 1) {
                compareFileSelect.innerHTML = '<option value="">Select a file to compare...</option>';
                processedFiles.forEach((file, index) => {
                    if (file.success) {
                        compareFileSelect.innerHTML += `<option value="${index}">File ${index + 1}: ${file.fileName}</option>`;
                    }
                });
                fileSelector.style.display = 'flex';
            } else {
                fileSelector.style.display = 'none';
            }
            
            // Show first successful file
            const firstSuccess = processedFiles.find(f => f.success);
            if (firstSuccess) {
                showFileComparison(processedFiles.indexOf(firstSuccess));
            }
            
            // Add download all button if multiple files
            if (processedFiles.filter(f => f.success).length > 1) {
                addDownloadAllButton();
                addExportAllButton();
            } else {
                hideDownloadAllButton();
                hideExportAllButton();
            }
            
            result.style.display = 'block';
        }

        function switchComparisonFile() {
            const compareFileSelect = document.getElementById('compareFileSelect');
            const selectedIndex = parseInt(compareFileSelect.value);
            
            if (!isNaN(selectedIndex) && processedFiles[selectedIndex]) {
                showFileComparison(selectedIndex);
            }
        }

        function showFileComparison(index) {
            const file = processedFiles[index];
            if (!file || !file.success) return;
            
            // Update global variables for compatibility
            originalContent = file.originalContent;
            convertedContent = file.convertedContent;
            originalFileName = file.originalName;
            changesMade = file.changes;
            
            // Update UI labels
            document.getElementById('originalFileLabel').textContent = `📄 Original File: ${file.fileName}`;
            document.getElementById('convertedFileLabel').textContent = `✨ Converted File: ${file.fileName}`;
              // Update comparison panels with diff highlighting
            const diffResult = createDiffDisplay(file.originalContent, file.convertedContent);
            document.getElementById('originalContent').innerHTML = diffResult.original;
            document.getElementById('convertedContent').innerHTML = diffResult.converted;
            
            // Set up synchronized scrolling
            setupSynchronizedScrolling();
            
            // Show sync indicator
            showSyncIndicator();

            // Show changes from this file
            displayChangesSummary(file.changes, file.fileName);
        }

        let isScrollSyncing = false;

        function setupSynchronizedScrolling() {
            const originalContent = document.getElementById('originalContent');
            const convertedContent = document.getElementById('convertedContent');
            
            // Remove any existing event listeners
            originalContent.removeEventListener('scroll', syncScrollRight);
            convertedContent.removeEventListener('scroll', syncScrollLeft);
            
            // Add synchronized scroll event listeners
            originalContent.addEventListener('scroll', syncScrollRight);
            convertedContent.addEventListener('scroll', syncScrollLeft);
            
            // Add visual feedback on scroll start/end
            let scrollTimeout;
            
            function handleScrollStart() {
                const syncIndicator = document.getElementById('syncIndicator');
                if (syncIndicator) {
                    syncIndicator.style.opacity = '1';
                    syncIndicator.style.transform = 'scale(1.05)';
                }
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    if (syncIndicator) {
                        syncIndicator.style.opacity = '0.8';
                        syncIndicator.style.transform = 'scale(1)';
                    }
                }, 500);
            }
            
            originalContent.addEventListener('scroll', handleScrollStart);
            convertedContent.addEventListener('scroll', handleScrollStart);
        }

        function syncScrollRight() {
            if (isScrollSyncing) return;
            isScrollSyncing = true;
            
            const originalContent = document.getElementById('originalContent');
            const convertedContent = document.getElementById('convertedContent');
            
            convertedContent.scrollTop = originalContent.scrollTop;
            convertedContent.scrollLeft = originalContent.scrollLeft;
            
            setTimeout(() => { isScrollSyncing = false; }, 5);
        }

        function syncScrollLeft() {
            if (isScrollSyncing) return;
            isScrollSyncing = true;
            
            const originalContent = document.getElementById('originalContent');
            const convertedContent = document.getElementById('convertedContent');
            
            originalContent.scrollTop = convertedContent.scrollTop;
            originalContent.scrollLeft = convertedContent.scrollLeft;
            
            setTimeout(() => { isScrollSyncing = false; }, 5);
        }

        function showSyncIndicator() {
            const syncIndicator = document.getElementById('syncIndicator');
            if (syncIndicator) {
                syncIndicator.style.display = 'flex';
            }
        }

        function hideSyncIndicator() {
            const syncIndicator = document.getElementById('syncIndicator');
            if (syncIndicator) {
                syncIndicator.style.display = 'none';
            }
        }

        function addDownloadAllButton() {
            const downloadAllBtn = document.getElementById('downloadAllBtn');
            
            // Show the download all button
            if (downloadAllBtn) {
                downloadAllBtn.style.display = 'block';
            }
        }

        function hideDownloadAllButton() {
            const downloadAllBtn = document.getElementById('downloadAllBtn');
            
            // Hide the download all button
            if (downloadAllBtn) {
                downloadAllBtn.style.display = 'none';
            }
        }

        function addExportAllButton() {
            const exportAllBtn = document.getElementById('exportAllBtn');
            
            // Show the export all button
            if (exportAllBtn) {
                exportAllBtn.style.display = 'block';
            }
        }

        function hideExportAllButton() {
            const exportAllBtn = document.getElementById('exportAllBtn');
            
            // Hide the export all button
            if (exportAllBtn) {
                exportAllBtn.style.display = 'none';
            }
        }

        function downloadAllFiles() {
            const successfulFiles = processedFiles.filter(f => f.success);
            
            if (successfulFiles.length === 0) {
                alert('No files to download');
                return;
            }

            // Show loading message
            const downloadBtn = document.getElementById('downloadAllBtn');
            const originalText = downloadBtn.innerHTML;
            downloadBtn.innerHTML = '<span class="icon">⏳</span>Creating ZIP...';
            downloadBtn.disabled = true;

            // Create ZIP file
            const zip = new JSZip();
            
            // Add each converted file to the ZIP
            successfulFiles.forEach(file => {
                const fileName = file.fileName.replace(/\.[^/.]+$/, '') + '_converted.' + file.fileName.split('.').pop();
                zip.file(fileName, file.convertedContent);
            });

            // Generate ZIP and download
            zip.generateAsync({type: "blob"})
                .then(function(content) {
                    // Create download link
                    const url = window.URL.createObjectURL(content);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `converted_files_${new Date().toISOString().slice(0,10)}.zip`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);

                    // Restore button
                    downloadBtn.innerHTML = originalText;
                    downloadBtn.disabled = false;
                })
                .catch(function(error) {
                    console.error('Error creating ZIP:', error);
                    alert('Error creating ZIP file. Please try again.');
                    
                    // Restore button
                    downloadBtn.innerHTML = originalText;
                    downloadBtn.disabled = false;
                });
        }

        function exportCurrentFileChanges() {
            let reportContent = '';
            const timestamp = new Date().toLocaleString();
            
            // Find current file being viewed
            const compareFileSelect = document.getElementById('compareFileSelect');
            let currentFile = null;
            let currentFileName = 'Unknown';
            let currentChanges = [];
            let targetDB = 'Unknown';
            
            if (compareFileSelect && compareFileSelect.value !== '') {
                // Multiple files - get the selected one
                const selectedIndex = parseInt(compareFileSelect.value);
                currentFile = processedFiles[selectedIndex];
                if (currentFile) {
                    currentFileName = currentFile.fileName;
                    currentChanges = currentFile.changes || [];
                    targetDB = currentFile.targetDB || 'Unknown';
                }
            } else if (processedFiles && processedFiles.length === 1) {
                // Single file
                currentFile = processedFiles[0];
                currentFileName = currentFile.fileName;
                currentChanges = currentFile.changes || [];
                targetDB = currentFile.targetDB || 'Unknown';
            } else {
                // Fallback to global variables
                currentFileName = originalFileName || 'Unknown';
                currentChanges = changesMade || [];
                targetDB = document.getElementById('databaseSelect')?.value || 'Unknown';
            }
            
            // Header
            reportContent += `DATABASE CONVERSION CHANGES REPORT - SINGLE FILE\n`;
            reportContent += `Generated on: ${timestamp}\n`;
            reportContent += `${'='.repeat(50)}\n\n`;
            
            // File details
            reportContent += `FILE: ${currentFileName}\n`;
            reportContent += `Target Database: ${targetDB.toUpperCase()}\n`;
            reportContent += `Changes Made (${currentChanges.length}):\n\n`;
            
            if (currentChanges.length > 0) {
                currentChanges.forEach((change, i) => {
                    reportContent += `  ${i + 1}. ${change}\n`;
                });
            } else {
                reportContent += `  No changes were required for this file.\n`;
            }
            
            // Create and download the report
            const blob = new Blob([reportContent], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentFileName.replace(/\.[^/.]+$/, '')}_Changes_Report_${new Date().getTime()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        function exportAllFilesChanges() {

        function performConversion(content, targetDB) {
            let converted = content;
            let changes = [];
            
            // Make search case-insensitive but preserve original case in replacements
            const originalContent = content;
            const upperContent = content.toUpperCase();
            
            // First, try stored procedure conversion
            const storedProcResult = convertStoredProcedure(content, targetDB);
            if (storedProcResult.changes.length > 0) {
                converted = storedProcResult.content;
                changes = [...changes, ...storedProcResult.changes];
            }
            
            // Check if this is a stored procedure
            const isStoredProcedure = upperContent.includes('CREATE PROCEDURE') || 
                                    upperContent.includes('CREATE PROC') ||
                                    upperContent.includes('BEGIN') && upperContent.includes('END');
            
            if (isStoredProcedure) {
                const procedureResult = convertStoredProcedure(content, targetDB);
                return procedureResult;
            }
            
            if (targetDB === 'oracle') {
                // VARCHAR to VARCHAR2 (case-insensitive)
                if (upperContent.includes('VARCHAR(')) {
                    converted = converted.replace(/VARCHAR\(/gi, 'VARCHAR2(');
                    changes.push('Changed VARCHAR( to VARCHAR2(');
                }
                
                // GETDATE() to SYSDATE (case-insensitive)
                if (upperContent.includes('GETDATE()')) {
                    converted = converted.replace(/GETDATE\(\)/gi, 'SYSDATE');
                    changes.push('Changed GETDATE() to SYSDATE');
                }
                
                // IDENTITY to Oracle sequence-based approach (case-insensitive)
                if (upperContent.includes('IDENTITY(1,1)')) {
                    converted = converted.replace(/IDENTITY\(1,1\)/gi, 'GENERATED BY DEFAULT AS IDENTITY');
                    changes.push('Changed IDENTITY(1,1) to GENERATED BY DEFAULT AS IDENTITY');
                }
                
                // TOP to ROWNUM (case-insensitive)
                if (upperContent.includes('SELECT TOP')) {
                    converted = converted.replace(/SELECT TOP (\d+)/gi, 'SELECT * FROM (SELECT');
                    converted = converted.replace(/ORDER BY/gi, 'ORDER BY) WHERE ROWNUM <= $1 ORDER BY');
                    changes.push('Changed SELECT TOP to ROWNUM-based query');
                }
                
                // DATETIME to DATE (case-insensitive)
                if (upperContent.includes('DATETIME')) {
                    converted = converted.replace(/DATETIME/gi, 'DATE');
                    changes.push('Changed DATETIME to DATE');
                }
                
                // DECIMAL to NUMBER (case-insensitive)
                if (upperContent.includes('DECIMAL(')) {
                    converted = converted.replace(/DECIMAL\(/gi, 'NUMBER(');
                    changes.push('Changed DECIMAL( to NUMBER(');
                }
                
                // INT to NUMBER (case-insensitive)
                if (upperContent.match(/\bINT\s/i)) {
                    converted = converted.replace(/\bINT\s/gi, 'NUMBER ');
                    changes.push('Changed INT to NUMBER');
                }
                
                // CHAR to VARCHAR2 (case-insensitive)
                if (upperContent.includes('CHAR(')) {
                    converted = converted.replace(/\bCHAR\(/gi, 'VARCHAR2(');
                    changes.push('Changed CHAR( to VARCHAR2(');
                }
                
                // Add warning for unsupported constructs
                if (upperContent.includes('CREATE PROCEDURE') || upperContent.includes('BEGIN') || upperContent.includes('DECLARE')) {
                    changes.push('⚠️ WARNING: Stored procedures require manual conversion - only basic syntax transformed');
                }
                
            } else if (targetDB === 'sqlserver') {
                // VARCHAR2 to VARCHAR (case-insensitive)
                if (upperContent.includes('VARCHAR2(')) {
                    converted = converted.replace(/VARCHAR2\(/gi, 'VARCHAR(');
                    changes.push('Changed VARCHAR2( to VARCHAR(');
                }
                
                // SYSDATE to GETDATE() (case-insensitive)
                if (upperContent.includes('SYSDATE')) {
                    converted = converted.replace(/SYSDATE/gi, 'GETDATE()');
                    changes.push('Changed SYSDATE to GETDATE()');
                }
                
                // Oracle sequences to IDENTITY (case-insensitive)
                if (upperContent.includes('.NEXTVAL')) {
                    converted = converted.replace(/\w+\.NEXTVAL/gi, 'IDENTITY(1,1)');
                    changes.push('Removed .NEXTVAL and added IDENTITY(1,1)');
                }
                
                // NUMBER to appropriate SQL Server types (case-insensitive)
                if (upperContent.includes('NUMBER(')) {
                    converted = converted.replace(/NUMBER\(/gi, 'DECIMAL(');
                    changes.push('Changed NUMBER( to DECIMAL(');
                }
                
                if (upperContent.match(/\bNUMBER\s/i)) {
                    converted = converted.replace(/\bNUMBER\s/gi, 'INT ');
                    changes.push('Changed NUMBER to INT');
                }
                
                // ROWNUM to TOP (case-insensitive)
                if (upperContent.includes('ROWNUM')) {
                    converted = converted.replace(/WHERE ROWNUM <= (\d+)/gi, '');
                    converted = converted.replace(/SELECT \* FROM \(SELECT/gi, 'SELECT TOP $1');
                    changes.push('Changed ROWNUM to TOP syntax');
                }
                
                // LIMIT to TOP (case-insensitive)
                if (upperContent.includes('LIMIT ')) {
                    converted = converted.replace(/LIMIT (\d+)/gi, '');
                    converted = converted.replace(/SELECT/gi, 'SELECT TOP $1');
                    changes.push('Changed LIMIT to TOP');
                }
                
                // Add warning for unsupported constructs
                if (upperContent.includes('CREATE PROCEDURE') || upperContent.includes('BEGIN') || upperContent.includes('DECLARE')) {
                    changes.push('⚠️ WARNING: Stored procedures require manual conversion - only basic syntax transformed');
                }
                
            } else if (targetDB === 'sybase') {
                // VARCHAR2 to VARCHAR
                if (content.includes('VARCHAR2(')) {
                    converted = converted.replace(/VARCHAR2\(/g, 'VARCHAR(');
                    changes.push('Changed VARCHAR2( to VARCHAR(');
                }
                
                // SYSDATE to GETDATE()
                if (content.includes('SYSDATE')) {
                    converted = converted.replace(/SYSDATE/g, 'GETDATE()');
                    changes.push('Changed SYSDATE to GETDATE()');
                }
                
                // Handle different syntax for LIMIT
                if (content.includes('LIMIT ')) {
                    converted = converted.replace(/LIMIT (\d+)/g, '');
                    converted = converted.replace(/SELECT/g, 'SET ROWCOUNT $1; SELECT');
                    changes.push('Changed LIMIT to SET ROWCOUNT');
                }
                
                // TOP to SET ROWCOUNT
                if (content.includes('SELECT TOP')) {
                    converted = converted.replace(/SELECT TOP (\d+)/g, 'SET ROWCOUNT $1; SELECT');
                    changes.push('Changed SELECT TOP to SET ROWCOUNT');
                }
                
                // NUMBER to appropriate Sybase types
                if (content.includes('NUMBER(')) {
                    converted = converted.replace(/NUMBER\(/g, 'DECIMAL(');
                    changes.push('Changed NUMBER( to DECIMAL(');
                }
                
                if (content.includes('NUMBER ')) {
                    converted = converted.replace(/NUMBER /g, 'INT ');
                    changes.push('Changed NUMBER to INT');
                }
                
                // IDENTITY syntax adjustment
                if (content.includes('IDENTITY(1,1)')) {
                    converted = converted.replace(/IDENTITY\(1,1\)/g, 'IDENTITY');
                    changes.push('Changed IDENTITY(1,1) to IDENTITY');
                }
            }
            
            if (changes.length === 0) {
                changes.push('No database-specific changes needed for this file');
            }
            
            return { content: converted, changes: changes };
        }

        // Comprehensive Stored Procedure Conversion Functions
        function convertStoredProcedure(content, targetDB) {
            let converted = content;
            let changes = [];
            
            // Detect if this is a stored procedure
            const upperContent = content.toUpperCase();
            const isStoredProcedure = upperContent.includes('CREATE PROCEDURE') || 
                                    upperContent.includes('CREATE PROC') ||
                                    upperContent.includes('CREATE OR REPLACE PROCEDURE');
            
            if (!isStoredProcedure) {
                return { content, changes: [] }; // Not a stored procedure, return as-is
            }
            
            if (targetDB === 'oracle') {
                // Convert to Oracle PL/SQL
                converted = convertToOracleStoredProc(converted, changes);
            } else if (targetDB === 'sqlserver') {
                // Convert to SQL Server T-SQL
                converted = convertToSQLServerStoredProc(converted, changes);
            } else if (targetDB === 'sybase') {
                // Convert to Sybase ASE
                converted = convertToSybaseStoredProc(converted, changes);
            }
            
            return { content: converted, changes };
        }
        
        function convertToOracleStoredProc(content, changes) {
            let converted = content;
            
            // 1. Procedure Declaration
            converted = converted.replace(/CREATE\s+PROCEDURE\s+(\w+)\s*\(/gi, 'CREATE OR REPLACE PROCEDURE $1 (');
            changes.push('✅ Converted to Oracle CREATE OR REPLACE PROCEDURE syntax');
            
            // 2. Parameter Declarations - Convert OUT to OUT
            converted = converted.replace(/\bOUT\s+(\w+)\s+(CHAR|VARCHAR|INT|DECIMAL)\s*\(([^)]+)\)/gi, '$1 OUT $2($3)');
            converted = converted.replace(/\bOUT\s+(\w+)\s+(INT|NUMBER)\b/gi, '$1 OUT NUMBER');
            changes.push('✅ Converted parameter declarations to Oracle format');
            
            // 3. Data Types
            converted = converted.replace(/\bCHAR\s*\(/gi, 'VARCHAR2(');
            converted = converted.replace(/\bVARCHAR\s*\(/gi, 'VARCHAR2(');
            converted = converted.replace(/\bINT\b/gi, 'NUMBER');
            converted = converted.replace(/\bINTEGER\b/gi, 'NUMBER');
            changes.push('✅ Converted data types to Oracle equivalents');
            
            // 4. BEGIN/END Structure
            converted = converted.replace(/\bBEGIN\b/gi, 'IS\nBEGIN');
            changes.push('✅ Added IS keyword before BEGIN');
            
            // 5. Variable Declarations
            converted = converted.replace(/DECLARE\s+(\w+)\s+(CHAR|VARCHAR|INT|DECIMAL)\s*\(([^)]+)\)/gi, '$1 VARCHAR2($3);');
            converted = converted.replace(/DECLARE\s+(\w+)\s+(INT|INTEGER)\b/gi, '$1 NUMBER;');
            converted = converted.replace(/DECLARE\s+(\w+)\s+EXCEPTION\s+FOR\s+SQLSTATE\s+'([^']+)'/gi, '$1 EXCEPTION;');
            changes.push('✅ Converted variable declarations to Oracle PL/SQL format');
            
            // 6. Cursor Declarations
            converted = converted.replace(/DECLARE\s+(\w+)\s+CURSOR\s+FOR\s*/gi, 'CURSOR $1 IS ');
            changes.push('✅ Converted cursor syntax to Oracle format');
            
            // 7. Loop Constructs
            converted = converted.replace(/(\w+):\s*LOOP/gi, 'LOOP');
            converted = converted.replace(/END\s+LOOP\s+(\w+);/gi, 'END LOOP;');
            converted = converted.replace(/LEAVE\s+(\w+);/gi, 'EXIT;');
            changes.push('✅ Converted loop syntax to Oracle PL/SQL');
            
            // 8. Exception Handling
            converted = converted.replace(/IF\s+SQLSTATE\s+=\s+(\w+)\s+THEN/gi, 'WHEN $1 THEN');
            changes.push('✅ Converted exception handling to Oracle format');
            
            // 9. FETCH Statement
            converted = converted.replace(/FETCH\s+NEXT\s+(\w+)\s+INTO/gi, 'FETCH $1 INTO');
            changes.push('✅ Converted FETCH syntax to Oracle format');
            
            // 10. CAST Function
            converted = converted.replace(/CAST\s*\(\s*([^)]+)\s+AS\s+INTEGER\s*\)/gi, 'TO_NUMBER($1)');
            changes.push('✅ Converted CAST to Oracle TO_NUMBER function');
            
            return converted;
        }
        
        function convertToSQLServerStoredProc(content, changes) {
            let converted = content;
            
            // 1. Procedure Declaration
            converted = converted.replace(/CREATE\s+OR\s+REPLACE\s+PROCEDURE/gi, 'CREATE PROCEDURE');
            changes.push('✅ Converted to SQL Server CREATE PROCEDURE syntax');
            
            // 2. Parameter Declarations
            converted = converted.replace(/(\w+)\s+OUT\s+(VARCHAR2|CHAR)\s*\(([^)]+)\)/gi, '@$1 $2($3) OUTPUT');
            converted = converted.replace(/(\w+)\s+OUT\s+(NUMBER|INT)\b/gi, '@$1 INT OUTPUT');
            converted = converted.replace(/(\w+)\s+IN\s+(VARCHAR2|CHAR)\s*\(([^)]+)\)/gi, '@$1 VARCHAR($3)');
            changes.push('✅ Converted parameters to SQL Server @parameter format');
            
            // 3. Data Types
            converted = converted.replace(/\bVARCHAR2\s*\(/gi, 'VARCHAR(');
            converted = converted.replace(/\bNUMBER\b/gi, 'INT');
            converted = converted.replace(/\bDATE\b/gi, 'DATETIME');
            changes.push('✅ Converted data types to SQL Server equivalents');
            
            // 4. IS/AS to AS
            converted = converted.replace(/\)\s*IS\s*BEGIN/gi, ')\nAS\nBEGIN');
            converted = converted.replace(/\)\s*AS\s*IS\s*BEGIN/gi, ')\nAS\nBEGIN');
            changes.push('✅ Converted IS to AS keyword');
            
            // 5. Variable Declarations
            converted = converted.replace(/(\w+)\s+(VARCHAR2|CHAR)\s*\(([^)]+)\);/gi, 'DECLARE @$1 VARCHAR($3);');
            converted = converted.replace(/(\w+)\s+(NUMBER|INT)\b;/gi, 'DECLARE @$1 INT;');
            changes.push('✅ Converted variable declarations to SQL Server DECLARE format');
            
            // 6. Cursor Declarations
            converted = converted.replace(/CURSOR\s+(\w+)\s+IS\s*/gi, 'DECLARE $1 CURSOR FOR ');
            changes.push('✅ Converted cursor syntax to SQL Server format');
            
            // 7. Loop to WHILE
            converted = converted.replace(/LOOP\s*/gi, 'WHILE @@FETCH_STATUS = 0\nBEGIN\n');
            converted = converted.replace(/END\s+LOOP;/gi, 'FETCH NEXT FROM curThisCust INTO @ThisCompany, @ThisValue;\nEND;');
            converted = converted.replace(/EXIT;/gi, 'BREAK;');
            changes.push('✅ Converted LOOP to SQL Server WHILE construct');
            
            // 8. Exception Handling
            converted = converted.replace(/WHEN\s+(\w+)\s+THEN/gi, 'IF @@ERROR <> 0\nBEGIN');
            changes.push('✅ Converted exception handling to SQL Server format');
            
            // 9. FETCH Statement
            converted = converted.replace(/FETCH\s+(\w+)\s+INTO/gi, 'FETCH NEXT FROM $1 INTO');
            changes.push('✅ Converted FETCH syntax to SQL Server format');
            
            // 10. Oracle Functions
            converted = converted.replace(/TO_NUMBER\s*\(\s*([^)]+)\s*\)/gi, 'CAST($1 AS INT)');
            converted = converted.replace(/SYSDATE/gi, 'GETDATE()');
            changes.push('✅ Converted Oracle functions to SQL Server equivalents');
            
            return converted;
        }
        
        function convertToSybaseStoredProc(content, changes) {
            let converted = content;
            
            // 1. Procedure Declaration
            converted = converted.replace(/CREATE\s+OR\s+REPLACE\s+PROCEDURE/gi, 'CREATE PROCEDURE');
            changes.push('✅ Converted to Sybase CREATE PROCEDURE syntax');
            
            // 2. Parameter Declarations
            converted = converted.replace(/(\w+)\s+OUT\s+(VARCHAR2|CHAR)\s*\(([^)]+)\)/gi, '@$1 VARCHAR($3) OUTPUT');
            converted = converted.replace(/(\w+)\s+OUT\s+(NUMBER|INT)\b/gi, '@$1 INT OUTPUT');
            changes.push('✅ Converted parameters to Sybase @parameter format');
            
            // 3. Data Types
            converted = converted.replace(/\bVARCHAR2\s*\(/gi, 'VARCHAR(');
            converted = converted.replace(/\bNUMBER\b/gi, 'INT');
            converted = converted.replace(/\bDATE\b/gi, 'DATETIME');
            changes.push('✅ Converted data types to Sybase equivalents');
            
            // 4. IS/AS to AS
            converted = converted.replace(/\)\s*IS\s*BEGIN/gi, ')\nAS\nBEGIN');
            changes.push('✅ Converted IS to AS keyword');
            
            // 5. Variable Declarations
            converted = converted.replace(/(\w+)\s+(VARCHAR2|CHAR)\s*\(([^)]+)\);/gi, 'DECLARE @$1 VARCHAR($3)');
            converted = converted.replace(/(\w+)\s+(NUMBER|INT)\b;/gi, 'DECLARE @$1 INT');
            changes.push('✅ Converted variable declarations to Sybase format');
            
            // 6. Cursor Declarations
            converted = converted.replace(/CURSOR\s+(\w+)\s+IS\s*/gi, 'DECLARE $1 CURSOR FOR ');
            changes.push('✅ Converted cursor syntax to Sybase format');
            
            // 7. Loop Constructs
            converted = converted.replace(/LOOP\s*/gi, 'WHILE @@sqlstatus = 0\nBEGIN\n');
            converted = converted.replace(/END\s+LOOP;/gi, 'FETCH $1\nEND');
            converted = converted.replace(/EXIT;/gi, 'BREAK');
            changes.push('✅ Converted LOOP to Sybase WHILE construct');
            
            // 8. Exception Handling
            converted = converted.replace(/WHEN\s+(\w+)\s+THEN/gi, 'IF @@error <> 0\nBEGIN');
            changes.push('✅ Converted exception handling to Sybase format');
            
            // 9. FETCH Statement
            converted = converted.replace(/FETCH\s+NEXT\s+(\w+)\s+INTO/gi, 'FETCH $1 INTO');
            changes.push('✅ Converted FETCH syntax to Sybase format');
            
            // 10. Functions
            converted = converted.replace(/TO_NUMBER\s*\(\s*([^)]+)\s*\)/gi, 'CONVERT(INT, $1)');
            converted = converted.replace(/SYSDATE/gi, 'GETDATE()');
            changes.push('✅ Converted functions to Sybase equivalents');
            
            return converted;
        }

        function createDiffDisplay(originalText, convertedText) {
            // Simple display without any diff highlighting
            const originalLines = originalText.split('\n');
            const convertedLines = convertedText.split('\n');
            
            const maxLines = Math.max(originalLines.length, convertedLines.length);
            let originalHtml = '';
            let convertedHtml = '';
            
            for (let i = 0; i < maxLines; i++) {
                const originalLine = originalLines[i] !== undefined ? originalLines[i] : '';
                const convertedLine = convertedLines[i] !== undefined ? convertedLines[i] : '';
                
                // Just display the lines without any highlighting
                originalHtml += `<span class="diff-line">${escapeHtml(originalLine)}</span>\n`;
                convertedHtml += `<span class="diff-line">${escapeHtml(convertedLine)}</span>\n`;
            }
            
            return {
                original: originalHtml,
                converted: convertedHtml
            };
        }
          function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
